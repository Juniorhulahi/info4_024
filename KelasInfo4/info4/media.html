<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Media</title>
<link rel="stylesheet" href="/dist/css/style.css" />
<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f4f6f8;
    margin: 0;
    padding: 0;
}

.container {
    width: 90%;
    max-width: 600px;
    margin: 40px auto;
}
h1 {
    text-align: center;
    margin-bottom: 30px;
    color: #333;
}
.post {
    background-color: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    margin-bottom: 20px;
    overflow: hidden;
}
.post-header {
    display: flex;
    align-items: center;
    padding: 15px;
}
.avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    margin-right: 15px;
}
.post-header h3 {
    margin: 0;
    font-size: 16px;
}
.post-header p {
    margin: 2px 0 0 0;
    color: gray;
    font-size: 12px;
}
.post-content {
    padding: 0 15px 15px 15px;
}
.post-content p {
    font-size: 14px;
    margin-bottom: 10px;
}
.post-img {
    width: 100%;
    border-radius: 10px;
}
.post-actions {
    display: flex;
    justify-content: space-around;
    padding: 10px 0;
    border-top: 1px solid #eee;
}
.post-actions button {
    background: none;
    border: none;
    cursor: pointer;
    font-weight: bold;
    color: #555;
    transition: color 0.3s;
}
.post-actions button:hover {
    color: #007bff;
}
.social-links {
    display: flex;
    justify-content: flex-start;
    gap: 10px;
    padding: 10px 15px;
}
.social-links a {
    text-decoration: none;
    color: #fff;
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 12px;
    transition: opacity 0.3s;
}

  /* 🔹 Tombol Akademik — versi kecil dan elegan */
  .home-btn {
    position: absolute;
    top: 12px;
    right: 18px;
    background-color: #374151;
    color: white;
    padding: 6px 10px; /* lebih kecil */
    font-size: 13px; /* ukuran teks diperkecil */
    border-radius: 6px;
    text-decoration: none;
    transition: 0.3s;
  }

  .home-btn:hover {
    background-color: #4b5563;
    transform: scale(1.05);
  }

.social-links a.instagram { background: #E1306C; }
.social-links a.facebook { background: #3b5998; }
.social-links a.tiktok { background: #000; }
.social-links a:hover { opacity: 0.8; }
</style>
</head>
<body>

  <header>
    <h1>Sosial Media Kelas Info4</h1>
    <a href="../info4/info4.html" class="home-btn"> Kembali</a>
  </header>

    <!-- Post 1 -->
    <div class="post">
        <div class="post-header">
            <img src="https://i.pravatar.cc/50?img=1" alt="User Avatar" class="avatar">
            <div>
                <h3>Marco</h3>
                <p>2 hours ago</p>
            </div>
        </div>
        <div class="post-content">
            <p>contoh postingan sosial media.</p>
            <img src="https://via.placeholder.com/400x200" alt="Post Image" class="post-img">
        </div>
        <div class="social-links">
            <a href="https://instagram.com/junior.hulahi/" target="_blank" class="instagram">Instagram</a>
            <a href="https://www.facebook.com/junior.hulahi/" target="_blank" class="facebook">Facebook</a>
            <a href="https://tiktok.com/@junior.hulahi" target="_blank" class="tiktok">TikTok</a>
        </div>
        <div class="post-actions">
            <button class="like-btn">Like <span class="like-count">0</span></button>
            <button class="comment-btn">Comment</button>
            <button class="share-btn">Share</button>
        </div>
    </div>

</div>

<script>
// Like button functionality
const likeButtons = document.querySelectorAll(".like-btn");
likeButtons.forEach(btn => {
    btn.addEventListener("click", e => {
        e.stopPropagation(); // prevent post link conflicts
        const countSpan = btn.querySelector(".like-count");
        let count = parseInt(countSpan.textContent);
        count++;
        countSpan.textContent = count;
        btn.style.color = "#e0245e";
    });
});
</script>
</body>
</html>
